modules:
  jira:projectPage:
    - key: auditpack-project-page
      resource: ui-main
      resolver:
        function: audit-resolver
      title: ProofGate Evidence
      layout: blank
  jira:globalPage:
    - key: auditpack-global-page
      resource: ui-main
      resolver:
        function: audit-resolver
      title: ProofGate Compliance
      layout: blank
  function:
    - key: audit-resolver
      handler: index.handler
resources:
  - key: ui-main
    path: static/ui/dist
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - storage:app
  # Intentionally NO external egress permissions to preserve
  # "Runs on Atlassian" zero-egress eligibility.
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/a2815c7e-f9fd-4485-940e-2be718397d42
  licensing:
    enabled: true
